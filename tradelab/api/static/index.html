<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home — TradeLab</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  .cards { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    margin-top:22px; }
  .card { padding:18px 20px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; }
  .card .n { font-size:26px; font-weight:650; font-variant-numeric:tabular-nums;
    letter-spacing:-.02em; }
  .card .k { color:var(--muted); font-size:14.5px; margin-top:2px; }
  .card .d { color:var(--muted); font-size:13.5px; margin-top:10px; line-height:1.55; }
  footer { margin-top:44px; padding-top:20px; border-top:1px solid var(--line);
    color:var(--muted); font-size:14px; max-width:66ch; line-height:1.6; }
</style>
</head>
<body>
<div class="layout">
  <main class="content">
    <h1>Home</h1>
    <p class="sub">Quantitative research laboratory · single operator</p>

    <div class="cards" id="cards"></div>

    <footer>
      This surface records decisions. It computes no figure and holds no venue
      credential, so it cannot start live trading — time series live in Grafana,
      and production is reached through the capital ramp rather than entered.
    </footer>
  </main>
</div>

<script src="/static/app.js"></script>
<script>
mount("/home", { onReady: load });

async function load() {
  // Counts only, and each one read from a table. The home screen computes
  // nothing: a figure that appears only here is a figure nobody can reproduce.
  const [events, series, quality] = await Promise.all([
    api("/api/events?limit=500"),
    api("/api/macro/series"),
    api("/api/data-quality").catch(() => []),
  ]);

  const unrated = events.filter((e) => !e.rated).length;
  const stale = series.filter((s) => s.days_old > 45).length;
  const unsafe = series.filter((s) => !s.point_in_time_safe).length;

  $("cards").innerHTML = [
    { n: events.length, k: "events captured",
      d: "Announcements promoted to annotatable occurrences." },
    { n: unrated, k: "awaiting a rating",
      d: "The useful work. Rate them on the News screen, in sigma." },
    { n: series.length, k: "macro series",
      d: `${stale} older than 45 days, ${unsafe} revised without vintages.` },
    { n: quality.length, k: "open data-quality issues",
      d: "Anomalies are recorded, never silently corrected." },
  ].map((c) => `
    <div class="card">
      <div class="n">${c.n}</div>
      <div class="k">${c.k}</div>
      <div class="d">${c.d}</div>
    </div>`).join("");
}
</script>
</body>
</html>
